<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{title}}</title>
    <style>
      #main {
        background-color: #190924;
        margin-block: 0;
        margin-inline: auto;
      }

      #links {
        min-height: fit-content;
      }

      #footer {
        margin-inline: auto;
      }

      .link {
        color: #f8f2ff;
        border-width: 1px;
        border-color: transparent;
        border-style: solid;
        border-radius: 2px;
      }

      .link:hover {
        color: #e9d4ff;
      }

      .link:visited {
        color: #dcfce7;
      }

      .link:visited:hover {
        color: #e9d4ff;
      }

      .link:focus-visible {
        border-color: #ff6467;

        outline-width: 0px;
      }

      .picLink {
        color: #f8f2ff;
        border-width: 1px;
        border-color: transparent;
        border-style: solid;
        border-radius: 2px;
      }

      .picLink:hover {
        border-color: #e9d4ff;
      }

      .picLink:visited {
        border-color: #dcfce7;
      }

      .picLink:visited:hover {
        border-color: #e9d4ff;
      }

      .picLink:focus-visible {
        border-color: #ff6467;

        outline-width: 0px;
      }
    </style>
  </head>
  <body
    style="
      display: flex;
      flex-direction: column;
      width: 100dvw;
      min-height: 100dvh;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border: 0 solid;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      font-family: Roboto, Arial, sans-serif;
      background-color: #190924;
    "
  >
    <table
      id="header"
      role="presentation"
      style="
        width: 100%;
        padding: 8px;
        margin-block: 12px;

        color: #f8f2ff;
        background-color: #0e0518;

        border-width: 8px 0px;
        border-style: solid;
        border-color: black;
      "
    >
      <tr>
        <td style="width: 100%">
          <table role="presentation">
            <tr>
              <td>
                <h1
                  style="
                    font-family: Merriweather, Georgia, serif;
                    font-weight: 400;
                    font-style: normal;
                    font-size: 36px;
                    line-height: 1.2;
                    margin: 4px;
                  "
                >
                  Zack M Williams PhD
                </h1>
              </td>
            </tr>
            <tr>
              <td>
                <h2
                  style="
                    font-size: 20px;
                    line-height: 1.5;
                    font-family: Merriweather, Georgia, serif;
                    font-weight: 400;
                    font-style: italic;

                    margin-inline: 4px;
                    margin-block: 0px;
                  "
                >
                  Scientist
                </h2>
              </td>
            </tr>
            <tr>
              <td>
                <h2
                  style="
                    font-size: 20px;
                    line-height: 1.5;

                    font-family: Merriweather, Georgia, serif;
                    font-weight: 400;
                    font-style: italic;
                    margin-inline: 4px;
                    margin-block: 0px;
                  "
                >
                  Software Developer
                </h2>
              </td>
            </tr>
          </table>
        </td>

        <td style="height: 100%; border: 2px dotted; border-color: transparent">
          <table
            id="links"
            style="
              height: 100%;
              border: 1px dashed;
              border-color: transparent;
              min-width: fit-content;
            "
            role="presentation"
          >
            <tr>
              <td style="text-align: right">
                <a
                  style="
                    text-wrap: nowrap;
                    font-size: 14px;
                    line-height: 1.5;
                    font-family: Merriweather, Georgia, serif;
                    font-weight: 400;
                    font-style: normal;
                    text-decoration: none;
                  "
                  class="link"
                  href="mailto:z.m.will@icloud.com"
                  >z.m.will@icloud.com</a
                >
              </td>
              <td>
                <img
                  src="https://raw.githubusercontent.com/zwill22/Signature/refs/heads/main/markdown/envelope.png"
                  width="16"
                  height="16"
                  alt="Envelope Icon"
                  style="display: block"
                />
              </td>
            </tr>
            <tr>
              <td style="text-align: right">
                <a
                  style="
                    text-wrap: nowrap;
                    font-size: 14px;
                    line-height: 1.5;
                    font-family: Merriweather, Georgia, serif;
                    font-weight: 400;
                    font-style: normal;
                    text-decoration: none;
                  "
                  class="link"
                  href="https://linkedin.com/in/zmwill"
                  >linkedin.com/in/zmwill</a
                >
              </td>
              <td>
                <img
                  src="https://raw.githubusercontent.com/zwill22/Signature/refs/heads/main/markdown/linkedin.png"
                  width="16"
                  height="16"
                  alt="LinkedIn Logo"
                  style="display: block"
                />
              </td>
            </tr>
            <tr>
              <td style="text-align: right">
                <a
                  style="
                    text-wrap: nowrap;
                    font-size: 14px;
                    line-height: 1.5;
                    font-family: Merriweather, Georgia, serif;
                    font-weight: 400;
                    font-style: normal;
                    text-decoration: none;
                  "
                  class="link"
                  href="https://www.github.com/zwill22"
                  >github.com/zwill22</a
                >
              </td>
              <td>
                <img
                  src="https://raw.githubusercontent.com/zwill22/Signature/refs/heads/main/markdown/github.png"
                  width="16"
                  height="16"
                  alt="GitHub Logo"
                  style="display: block"
                />
              </td>
            </tr>
            <tr>
              <td style="text-align: right">
                <a
                  style="
                    text-wrap: nowrap;
                    font-size: 14px;
                    line-height: 1.5;
                    font-family: Merriweather, Georgia, serif;
                    font-weight: 400;
                    font-style: normal;
                    text-decoration: none;
                  "
                  class="link"
                  href="tel:+447900000000"
                  >+44 7900 000000</a
                >
              </td>
              <td>
                <img
                  src="https://raw.githubusercontent.com/zwill22/Signature/refs/heads/main/markdown/phone.png"
                  width="16"
                  height="16"
                  alt="Phone Icon"
                  style="display: block"
                />
              </td>
            </tr>
            <tr>
              <td style="text-align: right">
                <a
                  style="
                    text-wrap: nowrap;
                    font-size: 14px;
                    line-height: 1.5;
                    font-family: Merriweather, Georgia, serif;
                    font-weight: 400;
                    font-style: normal;
                    text-decoration: none;
                  "
                  class="link"
                  href="https://www.zmwill.uk"
                  >zmwill.uk
                </a>
              </td>
              <td>
                <img
                  src="https://raw.githubusercontent.com/zwill22/Signature/refs/heads/main/markdown/globe.png"
                  width="16"
                  height="16"
                  alt="Internet Globe"
                  style="display: block"
                />
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>

    <div
      id="content"
      style="
        flex: 1;
        box-sizing: border-box;
        width: 100%;
        min-height: 100%;
        padding: 16px;
        background-color: #f8f2ff;
        border-width: 8px 0px;
        border-color: #0e0518;
        border-style: solid;
        vertical-align: top;
      "
    >
      {{{content}}}
    </div>
    <table role="presentation" id="footer" style="padding: 4px">
      <tr>
        <td style="padding: 4px; vertical-align: middle">
          <a
            class="picLink"
            style="display: block"
            href="https://www.linkedin.com/in/zmwill"
          >
            <img
              src="https://raw.githubusercontent.com/zwill22/Signature/refs/heads/main/markdown/linkedin.png"
              width="16"
              height="16"
              alt="LinkedIn logo"
              style="display: block"
            />
          </a>
        </td>

        <td style="padding: 4px; vertical-align: middle">
          <a
            class="picLink"
            style="display: block"
            href="https://www.github.com/zwill22"
          >
            <img
              src="https://raw.githubusercontent.com/zwill22/Signature/refs/heads/main/markdown/github.png"
              width="16"
              height="16"
              alt="GitHub Logo"
              style="display: block"
            />
          </a>
        </td>

        <td style="padding: 4px; vertical-align: middle">
          <a class="picLink" style="display: block" href="https://zmwill.uk">
            <img
              src="https://raw.githubusercontent.com/zwill22/Signature/refs/heads/main/markdown/globe.png"
              width="16"
              height="16"
              alt="Internet Globe"
              style="display: block"
            />
          </a>
        </td>
        <td style="color: #f8f2ff4d; padding: 4px; vertical-align: middle">
          © {{copyright}}
        </td>
      </tr>
    </table>
  </body>
</html>
