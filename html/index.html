<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>emailTitle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=PT+Serif:ital@0;1&family=Zen+Antique+Soft&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css"
    />
    <style>
      :root {
        --purple-dark: #190924;
        --purple-black: #0e0518;
        --purple-white: #f8f2ff;

        background-color: var(--purple-black);
        font-synthesis: none;
        text-rendering: optimizeLegibility;

        font-family:
          "Segoe UI", Roboto, "Helvetica Neue", "Noto Sans", Arial, sans-serif,
          "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol",
          "Noto Color Emoji";
      }

      body {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      main {
        display: flex;
        box-sizing: border-box;
        flex-direction: column;
        margin-block: 0;
        margin-inline: auto;
        max-width: 896px;
        padding-inline: 8px;
        padding-block: 16px;
        background-color: #f8f2ff1a;
        box-shadow:
          0 1px 3px 0 #ffffff80,
          0 1px 2px -1px #ffffff80;
        min-height: 100vh;
      }

      header {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        border: 0 solid;
        display: flex;
        min-width: fit-content;
        max-width: 896px;
        min-height: 186px;
        box-shadow:
          0 1px 3px 0 #ffffff80,
          0 1px 2px -1px #ffffff80;
        padding: 8px;
        @media (width >= 640px) {
          padding-inline: 16px;
        }
        color: var(--purple-white);
        justify-content: space-between;
        background-image: linear-gradient(
          to right,
          var(--purple-black),
          var(--purple-dark)
        );
        border-radius: 16px;
      }

      footer {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        border: 0 solid;
        display: flex;
        justify-content: end;
        margin-inline: auto;
      }

      i {
        padding-inline: 8px;
      }

      div {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        border: 0 solid;
      }

      .name {
        font-family: "Zen Antique Soft", serif;
        font-weight: 400;
        font-style: normal;
        font-size: 36px;
        line-height: 1.2;
        margin: 4px;
      }

      .title {
        font-size: 14px;
        line-height: 1.5;
        margin: auto;

        @media (width >= 640px) {
          font-size: 16px;
        }

        @media (width >=768px) {
          font-size: 20px;
        }

        font-family: "PT Serif", serif;
        font-weight: 400;
        font-style: italic;
      }

      .link {
        text-wrap: nowrap;
        font-size: 14px;
        line-height: 1.5;
        font-family: "PT Serif", serif;
        font-weight: 400;
        font-style: normal;
        text-decoration: none;
        color: #f8f2ff;
      }

      .link:hover {
        color: oklch(90.2% 0.063 306.703);
      }

      .link:visited {
        color: oklch(96.2% 0.044 156.743);
      }

      .link:visited:hover {
        color: oklch(90.2% 0.063 306.703);
      }

      .link:focus-visible {
        border-width: 0px;
        outline-width: 1px;
        outline-color: oklch(70.4% 0.191 22.216);
        box-shadow:
          0 1px 3px 0 #ffffff,
          0 1px 2px -1px #ffffff;
      }

      .block {
        display: block;
      }

      .inline {
        display: inline;
      }

      .logoColumn {
        /* hidden md:flex md:flex-col justify-center */
        display: none;
        @media (width >= 768px) {
          display: flex;
          flex-direction: column;
        }
        justify-content: center;
      }

      .titleColumn {
        /* flex flex-col md:text-nowrap justify-between text-left px-2 py-4" */
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 8px;
        text-align: left;
        @media (width >= 768px) {
          text-wrap: nowrap;
        }
      }

      .subtitles {
        padding-block: 8px;
      }

      .linkColumn {
        /* "flex flex-col justify-between text-right py-4" */
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        text-align: right;
        padding-block: 16px;
      }

      .contentBox {
        /* flex-1 bg-(--purple-white)/90 rounded-xl max-w-3xl mx-auto my-6 p-6 shadow shadow-green-100/50 w-full min-h-full" */
        flex: 1;

        background-color: #f8f2ffe6;
        width: 100%;
        min-height: 100%;
        max-width: 768px;
        border-radius: 12px;
        margin-inline: auto;
        margin-block: 24px;
        padding: 24px;
        box-shadow:
          0 1px 3px 0 #dcfce780,
          0 1px 2px -1px #dcfce780;
      }

      .footerText {
        color: #f8f2ff4d;
        padding: 8px;
        font-size: 14px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div class="logoColumn">
          <img
            src="https://raw.githubusercontent.com/zwill22/website/refs/heads/main/public/logo.svg"
            width="170"
            height="179"
            alt="Logo"
          />
        </div>

        <div class="titleColumn">
          <h1 class="name">Zack M Williams PhD</h1>
          <div class="subtitles">
            <h2 class="title">Scientist</h2>
            <h2 class="title">Software Developer</h2>
          </div>
        </div>

        <div class="linkColumn">
          <a class="block link" href="mailto:z.m.will@icloud.com">
            z.m.will@icloud.com
            <i class="bi bi-envelope-at"></i>
          </a>
          <a class="block link" href="https://www.linkedin.com/in/zmwill">
            linkedin.com/in/zmwill
            <i class="bi bi-linkedin"></i>
          </a>
          <a class="block link" href="https://www.github.com/zwill22">
            github.com/zwill22
            <i class="bi bi-github"></i>
          </a>
          <a class="block link" href="tel:07000000000">
            +44 7900 000000
            <i class="bi bi-phone"></i>
          </a>
          <a class="block link" href="https://zmwill.uk">
            zmwill.uk
            <i class="bi bi-globe"></i>
          </a>
        </div>
      </header>
      <div class="contentBox">Insert text here!</div>
      <footer>
        <p class="footerText">
          <a class="inline link" href="https://www.linkedin.com/in/zmwill">
            <i class="bi bi-linkedin"></i>
          </a>
          <a class="inline link" href="https://www.github.com/zwill22">
            <i class="bi bi-github"></i>
          </a>
          <a class="inline link" href="https://zmwill.uk">
            <i class="bi bi-globe"></i>
          </a>
        </p>
        <p class="footerText">|</p>
        <p class="footerText">
          <i class="bi bi-c-circle"></i> Date Z M Williams
        </p>
      </footer>
    </main>
  </body>
</html>
